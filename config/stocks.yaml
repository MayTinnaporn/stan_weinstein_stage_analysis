data:
  provider: yahoo_finance_via_yfinance
  start: "2010-01-01"
  auto_adjust: true
  week_rule: "W-FRI"

features:
  ma_period: 30
  ma_slope_period: 4
  atr_period: 14
  structure_lookback: 26
  volume_lookback: 20
  momentum_lookback: 26
  rs_lookback: 52
  rs_slope_period: 4

classifier:
  ma_slope_threshold: 0.01
  stage2a_min_volume_ratio: 1.50

research:
  market_benchmark: "SPY"
  default_sector_benchmark: null
  initial_symbols:
    - "AAPL"
    - "MSFT"
    - "NVDA"
    - "AMZN"
    - "JPM"
    - "XOM"
    - "CAT"
    - "WMT"
    - "KO"
    - "TSLA"
  forward_return_horizons:
    - 4
    - 8
    - 13
    - 26
