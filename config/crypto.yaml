exchange:
  id: binance
  quote_currency: USDT

data:
  provider: binance_via_ccxt
  start: "2020-01-01"
  week_rule: "W-SUN"

features:
  ma_period: 30
  ma_slope_period: 4
  atr_period: 14
  structure_lookback: 26
  volume_lookback: 20
  momentum_lookback: 26
  # Descriptive pre-breakout diagnostics; not a classifier threshold.
  base_quality_lookback: 13
  rs_lookback: 52
  rs_slope_period: 4

classifier:
  ma_slope_threshold: 0.01
  stage2a_min_volume_ratio: 1.30

transition_semantics:
  # Experimental parallel labels; these do not replace V0 events.
  stage2_rearm_stages:
    - 1
    - 4
  stage4_rearm_stages:
    - 2
    - 3
  # Predeclared structural hypothesis for Stage 2A episode starts.
  recent_stage1_lookback_weeks: 13
  recent_stage1_min_weeks: 1

research:
  benchmark_symbol: "BTC/USDT"
  initial_symbols:
    - "BTC/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
    - "XRP/USDT"
  forward_return_horizons:
    - 4
    - 8
    - 13
    - 26
